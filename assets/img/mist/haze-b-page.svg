<svg xmlns="http://www.w3.org/2000/svg" width="1200">
<!-- Sea mist bank (haze, layer b): a 1200x600 fractal-noise tile repeated down the section,
     faded along both edges, clear between 30% and 70% (page body). No height or viewBox, so it takes the section's height without stretching
     (CSS: background-size 1200px 100%). Baking the fade in here replaces a CSS mask, which
     made phones recomposite every bank offscreen on every frame. -->
<filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.014" numOctaves="4" seed="13" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.27 0 0 0 0 0.36 0 0 0 0 0.4 1.7 0 0 0 -0.74"/></filter>
<pattern id="p" width="1200" height="600" patternUnits="userSpaceOnUse"><rect width="1200" height="600" filter="url(#f)"/></pattern>
<linearGradient id="g" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="0.7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="100%" height="100%" fill="url(#g)"/></mask>
<rect width="100%" height="100%" fill="url(#p)" mask="url(#m)"/>
</svg>
