<svg xmlns="http://www.w3.org/2000/svg" width="1200">
<!-- Sea mist bank (light, layer b): a 1200x600 fractal-noise tile repeated down the section,
     faded along the top edge, gone by 55% (footer). No height or viewBox, so it takes the section's height without stretching
     (CSS: background-size 1200px 100%). Baking the fade in here replaces a CSS mask, which
     made phones recomposite every bank offscreen on every frame. -->
<filter id="f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.014" numOctaves="4" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .95 0 0 0 0 .92 0 0 0 0 .87 1.7 0 0 0 -0.72"/></filter>
<pattern id="p" width="1200" height="600" patternUnits="userSpaceOnUse"><rect width="1200" height="600" filter="url(#f)"/></pattern>
<linearGradient id="g" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="100%" height="100%" fill="url(#g)"/></mask>
<rect width="100%" height="100%" fill="url(#p)" mask="url(#m)"/>
</svg>
